<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Fixi - ניהול עלויות{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand"><a href="{{ url_for('index') }}">Fixi</a></div>
  <nav>
    <a href="{{ url_for('index') }}">לוח בקרה</a>
    <a href="{{ url_for('order') }}">הזמנה חדשה</a>
    <a href="{{ url_for('daily_order') }}">הזמנה יומית</a>
    <a href="{{ url_for('inventory') }}">מלאי</a>
    <a href="{{ url_for('tenders') }}">מכרזים</a>
    <a href="{{ url_for('settings') }}">הגדרות</a>
  </nav>
</header>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
